# Learning Grounds on our VPS, behind tagmephotos's nginx (docs/DEPLOY.md).
# The published ports are on 127.0.0.1 only, for deploy.sh's health check; the public way in is
# tagme's nginx over its network. Start it with deploy/deploy.sh, which passes .env.web for the
# build arguments below.
name: learning-grounds

services:
  api:
    build: ../api
    env_file: .env.api
    ports:
      - "127.0.0.1:8100:8000"
    volumes:
      # Canvas LMS data, kept across rebuilds.
      - api-data:/app/data
    networks:
      default: {}
      proxy:
        aliases: [lg-api]
    restart: unless-stopped

  web:
    build:
      context: ../web
      # Written into the browser code at build time.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in deploy/.env.web}
        NEXT_PUBLIC_TLDRAW_LICENSE_KEY: ${NEXT_PUBLIC_TLDRAW_LICENSE_KEY:-}
    env_file: .env.web
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      - api
    networks:
      default: {}
      proxy:
        aliases: [lg-web]
    restart: unless-stopped

networks:
  # tagmephotos's network. Its nginx owns ports 80 and 443 and reaches us here (deploy/nginx.conf).
  proxy:
    name: tagme_default
    external: true

volumes:
  api-data:
