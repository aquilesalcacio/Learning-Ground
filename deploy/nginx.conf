# Learning Grounds: two nginx sites in front of the Docker services in deploy/compose.yaml.
# docs/DEPLOY.md installs this with DOMAIN replaced by our domain; certbot then adds HTTPS to both.
# It only adds server blocks for our names, so the server's other sites are untouched.

# The web app: https://DOMAIN and https://www.DOMAIN
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN www.DOMAIN;

    client_max_body_size 16m;
    # Auth0 session cookies are large; nginx's default buffers reject them with a 502.
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# The API: https://api.DOMAIN
server {
    listen 80;
    listen [::]:80;
    server_name api.DOMAIN;

    # Homework page images are up to 10 MB.
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Check my work can take over 30 seconds.
        proxy_read_timeout 120s;
    }
}
