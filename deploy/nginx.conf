# Learning Grounds' sites inside tagmephotos's nginx (container tagme-nginx-1), which owns ports
# 80 and 443 on our VPS. deploy/nginx_site.py puts this into /srv/tagme/nginx/nginx.conf, with DOMAIN
# replaced by our domain. Our containers join tagme's network as lg-web and lg-api
# (deploy/compose.yaml). They're looked up on each request, so nginx still starts while ours are down.

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN www.DOMAIN api.DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# The web app: https://DOMAIN and https://www.DOMAIN
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name DOMAIN www.DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 16m;
    # Auth0 session cookies are large; nginx's default buffers reject them with a 502.
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    location / {
        set $lg_web http://lg-web:3000;
        proxy_pass $lg_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# The API: https://api.DOMAIN
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;
    # Homework page images are up to 10 MB.
    client_max_body_size 16m;

    location / {
        set $lg_api http://lg-api:8000;
        proxy_pass $lg_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Check my work can take over 30 seconds.
        proxy_read_timeout 120s;
    }
}
