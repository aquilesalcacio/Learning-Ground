[project]
name = "learning-grounds-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "google-genai>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=9.2.0",
]
